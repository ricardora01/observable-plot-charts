<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Observable Plot Area Chart</title>

  <script type="module">
    import * as Plot from "https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/+esm";

    // Load data from JSON file
    const response = await fetch("./data.json");
    const data = await response.json();

    // Convert date strings to Date objects
    data.forEach(d => {
      d.date = new Date(d.date);
      d.value = Number(d.value);
    });

    const container = document.querySelector("#chart");

    function drawChart() {

      // Remove previous chart when resizing
      container.innerHTML = "";

      const chart = Plot.plot({
        width: container.clientWidth,
        height: 450,

        marginLeft: 60,
        marginBottom: 50,

        x: {
          type: "utc",
          label: "Date →",
          grid: true
        },

        y: {
          label: "↑ Value",
          grid: true,
          nice: true
        },

        marks: [

          // Area
          Plot.areaY(data, {
            x: "date",
            y: "value",
            curve: "monotone-x",
            fill: "#4f86c6",
            fillOpacity: 0.25
          }),

          // Line over the area
          Plot.lineY(data, {
            x: "date",
            y: "value",
            curve: "monotone-x",
            stroke: "#2563eb",
            strokeWidth: 2
          }),

          // Interactive hover
          Plot.dot(
            data,
            Plot.pointerX({
              x: "date",
              y: "value",
              r: 6,
              fill: "#2563eb",
              stroke: "white",
              strokeWidth: 2
            })
          ),

          // Interactive tooltip
          Plot.tip(
            data,
            Plot.pointerX({
              x: "date",
              y: "value",
              title: d =>
                `${d.date.toLocaleDateString()}\nValue: ${d.value}`
            })
          ),

          // Vertical rule following the pointer
          Plot.ruleX(
            data,
            Plot.pointerX({
              x: "date",
              stroke: "#666",
              strokeOpacity: 0.4
            })
          )
        ]
      });

      container.append(chart);
    }

    // Initial render
    drawChart();

    // Make chart responsive
    const resizeObserver = new ResizeObserver(drawChart);
    resizeObserver.observe(container);

  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f5f7fa;
    }

    .chart-container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    h2 {
      margin-top: 0;
    }

    #chart {
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="chart-container">

    <h2>Monthly Values</h2>

    <div id="chart"></div>

  </div>

</body>
</html>
